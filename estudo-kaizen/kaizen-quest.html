<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kaizen Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a12;--panel:#0d1322;--panel2:#121a2e;--line:#1f2b47;--txt:#e7ecff;--mut:#8d9abd;
  --cyan:#00e5ff;--mag:#ff2bd6;--lime:#a6ff00;--amb:#ffb020;--red:#ff4d6d;--vio:#8b5cff;
  --r:14px;--nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 600px at 100% -10%,rgba(139,92,255,.16),transparent 60%),
                   radial-gradient(900px 500px at -10% 110%,rgba(0,229,255,.10),transparent 60%);
  background-attachment:fixed;
  color:var(--txt);font-family:'Rajdhani',system-ui,-apple-system,Segoe UI,sans-serif;font-size:17px;line-height:1.45;
  min-height:100vh;overflow-x:hidden;
}
h1,h2,h3,.orb{font-family:'Orbitron',system-ui,sans-serif;letter-spacing:.04em;margin:0}
h2{font-size:1.15rem}h3{font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}

/* ---------- NAV ---------- */
nav{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:rgba(8,12,22,.85);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px}
.logo{font-family:'Orbitron';font-weight:900;font-size:1.05rem;padding:6px 10px 18px;letter-spacing:.08em}
.logo span{color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.6)}
.navbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;font-weight:700;font-size:1.02rem;color:var(--mut);text-align:left}
.navbtn .ic{font-size:1.25rem;width:26px;text-align:center}
.navbtn:hover{color:var(--txt);background:var(--panel2)}
.navbtn.on{color:var(--txt);background:linear-gradient(90deg,rgba(0,229,255,.16),transparent);border-color:rgba(0,229,255,.35)}
main{padding:22px clamp(14px,3vw,34px) 40px;max-width:1100px;width:100%;margin:0 auto}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:4px 4px env(safe-area-inset-bottom);flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);z-index:50}
  .logo{display:none}
  .navbtn{flex-direction:column;gap:0;padding:6px 2px;font-size:.68rem;flex:1;justify-content:center;align-items:center;letter-spacing:.02em}
  .navbtn .ic{font-size:1.3rem}
  .navbtn.on{background:linear-gradient(180deg,rgba(0,229,255,.18),transparent)}
  main{padding:14px 14px calc(var(--nav) + 30px)}
  .toasts{top:auto;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{max-width:none}
}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,var(--panel),var(--panel2));margin-bottom:18px;position:relative;overflow:hidden}
.hud::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 4px);pointer-events:none}
.avatar{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-family:'Orbitron';font-weight:900;font-size:1.2rem;background:conic-gradient(from 200deg,var(--cyan),var(--vio),var(--mag),var(--cyan));color:#06080f;box-shadow:0 0 18px rgba(0,229,255,.35)}
.hud .who{flex:1;min-width:0}
.hud .name{font-family:'Orbitron';font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .rank{color:var(--mut);font-size:.9rem;font-weight:600}
.xpbar{height:10px;border-radius:99px;background:#0a0f1c;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--mag));box-shadow:0 0 10px var(--cyan);transition:width .6s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#0a1020;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.fire{border-color:rgba(255,176,32,.5);color:var(--amb)}
.chip.lvl{border-color:rgba(0,229,255,.5);color:var(--cyan)}
.gear{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;cursor:pointer;flex:none}

/* ---------- COMMON ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),rgba(13,19,34,.7));padding:16px;position:relative}
.card.glow{border-color:rgba(0,229,255,.35);box-shadow:0 0 0 1px rgba(0,229,255,.08),0 10px 30px rgba(0,0,0,.35)}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h2::before{content:"// ";color:var(--cyan)}
.mut{color:var(--mut)}.small{font-size:.9rem}
.tag{font-family:'Orbitron';font-size:.62rem;letter-spacing:.12em;padding:3px 8px;border-radius:6px;background:rgba(0,229,255,.12);color:var(--cyan);border:1px solid rgba(0,229,255,.3);text-transform:uppercase;white-space:nowrap}
.tag.m{background:rgba(255,43,214,.12);color:var(--mag);border-color:rgba(255,43,214,.3)}
.tag.l{background:rgba(166,255,0,.1);color:var(--lime);border-color:rgba(166,255,0,.3)}
.tag.a{background:rgba(255,176,32,.1);color:var(--amb);border-color:rgba(255,176,32,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid rgba(0,229,255,.45);background:linear-gradient(180deg,rgba(0,229,255,.22),rgba(0,229,255,.08));color:var(--txt);font-weight:700;font-size:1rem;cursor:pointer;min-height:46px;transition:transform .08s,box-shadow .2s;text-decoration:none}
.btn:hover{box-shadow:0 0 18px rgba(0,229,255,.35)}
.btn:active{transform:scale(.97)}
.btn.mag{border-color:rgba(255,43,214,.5);background:linear-gradient(180deg,rgba(255,43,214,.25),rgba(255,43,214,.08))}
.btn.lime{border-color:rgba(166,255,0,.5);background:linear-gradient(180deg,rgba(166,255,0,.2),rgba(166,255,0,.06))}
.btn.ghost{border-color:var(--line);background:var(--panel2)}
.btn.red{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.12)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:.92rem}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:700;font-size:.92rem;margin:10px 0 4px;color:var(--mut)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0a0f1c;outline:none;font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.stat{text-align:center;padding:14px 8px}
.stat b{display:block;font-family:'Orbitron';font-size:1.5rem;color:var(--cyan)}
.stat span{color:var(--mut);font-weight:600;font-size:.9rem}
.empty{text-align:center;padding:28px 16px;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
.empty .big{font-size:2.2rem}
.prog{height:8px;border-radius:99px;background:#0a0f1c;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan))}

/* ---------- MISSIONS ---------- */
.mission{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px}
.mission.done{opacity:.55}
.mission.done .mt{text-decoration:line-through}
.check{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid var(--cyan);background:none;cursor:pointer;display:grid;place-items:center;font-weight:900;color:#06080f}
.mission.done .check{background:var(--lime);border-color:var(--lime)}
.mission .mt{font-weight:700}
.mission .mb{flex:1;min-width:0}
.mission .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.week{display:flex;gap:8px;justify-content:space-between}
.day{flex:1;text-align:center;font-size:.78rem;color:var(--mut);font-weight:700}
.day i{display:block;height:34px;border-radius:9px;border:1px solid var(--line);background:#0a0f1c;margin-bottom:4px}
.day.on i{background:linear-gradient(180deg,var(--lime),#5bbf00);border-color:var(--lime);box-shadow:0 0 12px rgba(166,255,0,.35)}
.day.today{color:var(--cyan)}

/* ---------- SCANNER ---------- */
.drop{border:2px dashed rgba(0,229,255,.4);border-radius:var(--r);padding:26px 16px;text-align:center;background:rgba(0,229,255,.04);cursor:pointer;transition:.2s}
.drop.over{background:rgba(0,229,255,.12);border-color:var(--cyan)}
.drop .big{font-size:2.4rem}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumb{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(0,0,0,.75);cursor:pointer}
.loader{display:none;margin-top:12px}
.loader.on{display:block}
.scanline{height:6px;border-radius:99px;background:#0a0f1c;overflow:hidden;border:1px solid var(--line)}
.scanline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mag),var(--cyan));transition:width .3s}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px;border:0;background:var(--panel);cursor:pointer;font-weight:700;color:var(--mut)}
.seg button.on{background:rgba(0,229,255,.16);color:var(--txt)}

/* ---------- DECK ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:14px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;color:var(--mut)}
.tabs button.on{color:var(--txt);border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.12)}
.list{margin:0;padding-left:20px}
.list li{margin:8px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 52px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--panel)}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:'Orbitron';font-size:.8rem;background:rgba(255,43,214,.18);color:var(--mag);border:1px solid rgba(255,43,214,.4)}
.mm{display:flex;flex-direction:column;align-items:center}
.mm .core{padding:14px 22px;border-radius:16px;border:2px solid var(--cyan);background:rgba(0,229,255,.1);font-family:'Orbitron';font-weight:700;text-align:center;box-shadow:0 0 22px rgba(0,229,255,.25);max-width:100%}
.mm .stem{width:2px;height:22px;background:var(--cyan)}
.mm .branches{width:100%;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:2px solid var(--line);padding-top:16px}
.br{border-radius:12px;padding:12px;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--panel)}
.br b{color:var(--c);font-family:'Orbitron';font-size:.82rem;letter-spacing:.05em}
.br ul{margin:6px 0 0;padding-left:18px;font-size:.95rem}
.ex{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel)}
.ex .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.ex .q{white-space:pre-line;font-weight:600}
.ans{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(166,255,0,.07);border:1px solid rgba(166,255,0,.25);white-space:pre-line}
.ans.on{display:block}
.tick{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:.92rem;user-select:none}
.tick input{width:20px;height:20px;accent-color:var(--lime)}
.deckcard{cursor:pointer;transition:.15s}
.deckcard:hover{border-color:rgba(0,229,255,.45);transform:translateY(-2px)}

/* ---------- ARENA ---------- */
.boss{display:flex;align-items:center;gap:14px}
.boss .face{font-size:3rem;filter:drop-shadow(0 0 14px rgba(255,43,214,.6));animation:float 2.4s ease-in-out infinite}
.boss.hit .face{animation:hit .35s}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-6deg)}75%{transform:translateX(8px) rotate(6deg)}}
.hp{height:14px;border-radius:99px;background:#0a0f1c;border:1px solid var(--line);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--mag));transition:width .4s}
.timer{height:6px;border-radius:99px;background:#0a0f1c;overflow:hidden;margin:12px 0}
.timer i{display:block;height:100%;background:var(--amb);transition:width .1s linear}
.qbox{font-size:1.12rem;font-weight:700;white-space:pre-line;margin:8px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:1.02rem;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:'Orbitron';font-size:.75rem;color:var(--cyan);border:1px solid rgba(0,229,255,.4);border-radius:6px;padding:2px 7px;flex:none;margin-top:2px}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt.ok{border-color:var(--lime);background:rgba(166,255,0,.12)}
.opt.bad{border-color:var(--red);background:rgba(255,77,109,.12)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:12px;white-space:pre-line}
.fb.ok{background:rgba(166,255,0,.08);border:1px solid rgba(166,255,0,.3)}
.fb.bad{background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.3)}
.hearts{font-size:1.2rem;letter-spacing:2px}
.result{text-align:center;padding:26px 16px}
.result h1{font-size:clamp(1.6rem,6vw,2.6rem);margin-bottom:8px}
.win{color:var(--lime);text-shadow:0 0 20px rgba(166,255,0,.5)}
.lose{color:var(--red);text-shadow:0 0 20px rgba(255,77,109,.5)}

/* ---------- PROFILE ---------- */
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.ach .ai{font-size:1.7rem;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:#0a0f1c;border:1px solid var(--line)}
.ach.lock{opacity:.4;filter:grayscale(1)}
.ach.got{border-color:rgba(255,176,32,.45)}
.ach.got .ai{border-color:var(--amb);box-shadow:0 0 14px rgba(255,176,32,.35)}
.rk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;background:var(--panel)}
.rk .pos{font-family:'Orbitron';width:30px;text-align:center;color:var(--mut)}
.rk.me{border-color:var(--cyan);background:rgba(0,229,255,.1)}
.rk .nm{flex:1;font-weight:700}

/* ---------- OVERLAYS ---------- */
.toasts{position:fixed;top:14px;right:14px;left:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:200;pointer-events:none}
.toast{pointer-events:auto;max-width:360px;padding:12px 16px;border-radius:12px;background:#0d1426;border:1px solid rgba(0,229,255,.45);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:700;animation:tin .3s}
.toast.xp{border-color:rgba(166,255,0,.5)}
.toast.ach{border-color:rgba(255,176,32,.6)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.modal{position:fixed;inset:0;background:rgba(3,5,10,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:150}
.modal.on{display:flex}
.modal .box{width:100%;max-width:480px;max-height:90vh;overflow:auto;border:1px solid rgba(0,229,255,.4);border-radius:18px;background:var(--panel);padding:20px}
.focus{text-align:center}
.focus .clock{font-family:'Orbitron';font-size:clamp(3rem,16vw,5rem);font-weight:900;color:var(--cyan);text-shadow:0 0 24px rgba(0,229,255,.5);margin:12px 0}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="logo">KAIZEN<span>//</span>QUEST</div>
    <button class="navbtn" data-go="base"><span class="ic">🛰️</span>Base</button>
    <button class="navbtn" data-go="missoes"><span class="ic">⚔️</span>Missões</button>
    <button class="navbtn" data-go="scanner"><span class="ic">📷</span>Scanner</button>
    <button class="navbtn" data-go="inventario"><span class="ic">🎒</span>Inventário</button>
    <button class="navbtn" data-go="arena"><span class="ic">🐉</span>Arena</button>
    <button class="navbtn" data-go="perfil"><span class="ic">🏆</span>Perfil</button>
  </nav>
  <main>
    <div class="hud" id="hud"></div>
    <div id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<input type="file" id="fileIn" accept="image/*" multiple class="hide">
<input type="file" id="backupIn" accept="application/json,.json" class="hide">

<script>
/* =========================================================
   KAIZEN QUEST — app de estudo Kaizen com estética gamer
   Tudo salvo no localStorage do navegador.
   ========================================================= */
'use strict';

const KEY = 'kaizenQuest.v1';
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const CLAUDE_MODEL = 'claude-opus-5-5';

/* ---------------- STATE ---------------- */
const DEF = () => ({
  v: 1,
  player: { name: '', xp: 0, streak: 0, best: 0, lastActive: null },
  days: {},               // 'AAAA-MM-DD' -> xp do dia
  missions: [], campaigns: [], decks: [], battles: [],
  stats: { missions: 0, exercises: 0, critical: 0, bosses: 0, perfect: 0, camps: 0, scans: 0 },
  ach: {}, lastGen: null,
  settings: { mode: 'local', apiKey: '' }
});
let S = load();
let VIEW = 'base', DECK = null, DECKTAB = 'resumo', IMGS = [], B = null, BTIMER = null, FOCUS = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw), base = DEF();
      return Object.assign(base, d, { player: Object.assign(base.player, d.player), stats: Object.assign(base.stats, d.stats), settings: Object.assign(base.settings, d.settings) }); }
  } catch (e) { console.warn(e); }
  return DEF();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Memória do navegador cheia. Exporte um backup no Perfil e apague conteúdos antigos.'); }
}

/* ---------------- UTILS ---------------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dstr = d => { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const today = () => dstr(new Date());
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate() + n); return dstr(d); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* ---------------- LEVELS ---------------- */
const need = n => Math.round(60 * Math.pow(n - 1, 1.55));
const levelOf = xp => { let l = 1; while (xp >= need(l + 1)) l++; return l; };
const TITLES = [[1, 'Recruta'], [3, 'Aprendiz'], [5, 'Explorador'], [8, 'Estrategista'], [12, 'Guardião do Saber'], [16, 'Mestre Kaizen'], [20, 'Lenda']];
const titleOf = l => TITLES.filter(t => l >= t[0]).pop()[1];

function gain(xp, why) {
  if (!xp) return;
  const before = levelOf(S.player.xp);
  S.player.xp += xp;
  S.days[today()] = (S.days[today()] || 0) + xp;
  markActive();
  toast(`+${xp} XP · ${why}`, 'xp');
  const after = levelOf(S.player.xp);
  if (after > before) levelUp(after);
  checkAch(); save(); renderHud();
}
function markActive() {
  const t = today(), p = S.player;
  if (p.lastActive === t) return;
  p.streak = (p.lastActive === dayOffset(-1)) ? p.streak + 1 : 1;
  p.best = Math.max(p.best, p.streak);
  p.lastActive = t;
}
function streakNow() { const p = S.player; return (p.lastActive === today() || p.lastActive === dayOffset(-1)) ? p.streak : 0; }

/* ---------------- KAIZEN: MISSÕES DIÁRIAS ---------------- */
const CYCLE = [
  ['Reconhecimento: leia só títulos, negritos e imagens de "{a}"', 'Leitura'],
  ['Leia 1 parte de "{a}" e sublinhe 3 palavras-chave', 'Leitura'],
  ['Escaneie a página de "{a}" no Scanner e monte o Mapa Mental no caderno', 'Scanner'],
  ['Resolva 3 exercícios do Caderno sobre "{a}"', 'Caderno'],
  ['Boss Fight: enfrente o chefe de "{a}" na Arena', 'Arena'],
  ['Explique "{a}" em voz alta por 2 min, sem olhar (Técnica Feynman)', 'Revisão'],
  ['Revisão relâmpago: redesenhe o mapa de "{a}" de memória e compare', 'Revisão']
];
function buildPlan(assunto, dias) {
  const plan = [];
  for (let i = 0; i < dias; i++) {
    const c = CYCLE[i % CYCLE.length], parte = Math.floor(i / CYCLE.length) + 1;
    plan.push({ t: c[0].replace('{a}', assunto) + (dias > CYCLE.length ? ` (rodada ${parte})` : ''), k: c[1] });
  }
  return plan;
}
function ensureToday() {
  const t = today();
  if (S.lastGen === t) return;
  S.lastGen = t;
  // missões "ritual" antigas não concluídas expiram
  S.missions = S.missions.filter(m => !(m.ritual && !m.done && m.date !== t));
  S.campaigns.forEach(c => {
    if (c.step >= c.plan.length) return;
    if (S.missions.some(m => m.camp === c.id && !m.done)) return;
    const p = c.plan[c.step];
    S.missions.push({ id: uid(), title: p.t, sub: c.subject, kind: p.k, min: c.min, xp: 10 + c.min * 2, date: t, camp: c.id, done: false });
  });
  S.missions.push({ id: uid(), title: 'Ritual 1%: abra o caderno e escreva 1 coisa que você lembra do último estudo', sub: 'Kaizen', kind: 'Ritual', min: 2, xp: 10, date: t, ritual: true, done: false });
  // limpa concluídas com mais de 21 dias
  const lim = dayOffset(-21);
  S.missions = S.missions.filter(m => !m.done || m.doneAt >= lim);
  save();
}
function completeMission(id) {
  const m = S.missions.find(x => x.id === id);
  if (!m || m.done) return;
  m.done = true; m.doneAt = today();
  S.stats.missions++;
  if (m.camp) {
    const c = S.campaigns.find(x => x.id === m.camp);
    if (c) { c.step++; if (c.step >= c.plan.length) { S.stats.camps++; gain(100, `Campanha "${c.subject}" concluída!`); } }
  }
  gain(m.xp, 'Missão concluída');
  render();
}

function bindScanner() {
  const drop = $('#drop');
  drop.onclick = () => $('#fileIn').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };
  drawThumbs();
}
function drawThumbs() {
  const t = $('#thumbs'); if (!t) return;
  t.innerHTML = IMGS.map((src, i) => `<div class="thumb"><img src="${src}" alt="página ${i + 1}"><button data-act="rmImg" data-i="${i}">✕</button></div>`).join('');
}
function addFiles(files) {
  [...files].filter(f => f.type.startsWith('image/')).forEach(f => {
    const r = new FileReader();
    r.onload = () => shrink(r.result).then(d => { IMGS.push(d); drawThumbs(); });
    r.readAsDataURL(f);
  });
}
function shrink(src, max = 1800) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => res(src);
    img.src = src;
  });
}
function loadScript(url) {
  return new Promise((ok, no) => {
    if (window.Tesseract) return ok();
    const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = () => no(new Error('Sem internet para baixar o leitor de texto.'));
    document.head.appendChild(s);
  });
}
async function runOCR() {
  if (!IMGS.length) return toast('📷 Adicione uma foto primeiro.');
  const L = $('#ocrLoad'), msg = $('#ocrMsg'), bar = $('#ocrBar');
  L.classList.add('on');
  try {
    msg.textContent = 'Baixando leitor de texto (só na primeira vez)…';
    await loadScript(TESS_URL);
    let page = 0;
    const worker = await Tesseract.createWorker('por', 1, {
      logger: m => { if (m.status === 'recognizing text') { bar.style.width = Math.round(((page + m.progress) / IMGS.length) * 100) + '%'; msg.textContent = `Lendo página ${page + 1} de ${IMGS.length}…`; } }
    });
    let out = '';
    for (page = 0; page < IMGS.length; page++) { const r = await worker.recognize(IMGS[page]); out += r.data.text.trim() + '\n\n'; }
    await worker.terminate();
    const ta = $('#sText'); ta.value = (ta.value ? ta.value + '\n\n' : '') + out.trim();
    toast('✅ Texto extraído. Confira e corrija antes de gerar.');
  } catch (e) { toast('⚠️ ' + e.message); }
  L.classList.remove('on'); bar.style.width = '0';
}

  const attempts = [
    { body: { ...base, output_config: { format: { type: 'json_schema', schema: AI_SCHEMA } }, fallbacks: 'default' }, extra: { 'anthropic-beta': 'server-side-fallback-2026-07-01' } },
    { body: base, extra: {} } // plano B: sem recursos opcionais
  ];
  let lastErr;
  for (const at of attempts) {
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { ...headers, ...at.extra }, body: JSON.stringify(at.body) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      if (j.stop_reason === 'refusal') throw new Error('A IA não conseguiu processar este conteúdo. Tente o Modo Local.');
      const out = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      const a = out.indexOf('{'), b = out.lastIndexOf('}');
      if (a < 0 || b < a) throw new Error('Resposta da IA veio incompleta. Tente de novo.');
      return JSON.parse(out.slice(a, b + 1));
    }
    lastErr = j.error?.message || ('Erro ' + r.status);
    if (r.status === 401) throw new Error('Chave da API inválida. Confira em ⚙️ Configurações.');
    if (r.status !== 400) break;
  }
  throw new Error('IA indisponível: ' + lastErr);
}
function normalize(a) {
  const arr = x => Array.isArray(x) ? x : [];
  a.resumo = arr(a.resumo).map(String);
  a.mapa = a.mapa || { centro: a.titulo, ramos: [] };
  a.mapa.ramos = arr(a.mapa.ramos).map(r => ({ nome: String(r.nome || ''), itens: arr(r.itens).map(String) }));
  ['conexoes', 'passos_mapa', 'perguntas'].forEach(k => a[k] = arr(a[k]).map(String));
  a.dicas = arr(a.dicas).map(d => ({ titulo: String(d.titulo || 'Dica'), texto: String(d.texto || '') }));
  a.exercicios = arr(a.exercicios).map(e => ({ tipo: String(e.tipo || 'Exercício'), enunciado: String(e.enunciado || ''), resposta: String(e.resposta || '') }));
  a.quiz = arr(a.quiz).filter(q => arr(q.opcoes).length >= 2 && Number.isInteger(q.correta) && q.correta >= 0 && q.correta < q.opcoes.length)
    .map(q => ({ tipo: q.tipo === 'vf' ? 'vf' : 'mc', pergunta: String(q.pergunta), opcoes: q.opcoes.map(String), correta: q.correta, explicacao: String(q.explicacao || '') }));
  if (!a.resumo.length && !a.quiz.length) throw new Error('A IA não encontrou conteúdo legível nas fotos.');
  return a;
}

function startFight(id) {
  let qs, title;
  if (id === 'mix') { qs = S.decks.flatMap(d => d.a.quiz); title = 'Modo Caos'; }
  else { const d = S.decks.find(x => x.id === id); if (!d) return; qs = d.a.quiz; title = d.title; }
  qs = shuffle(qs).slice(0, 10).map(q => {
    if (q.tipo === 'vf') return q;
    const order = shuffle(q.opcoes.map((o, i) => i));
    return { ...q, opcoes: order.map(i => q.opcoes[i]), correta: order.indexOf(q.correta) };
  });
  if (!qs.length) return toast('Sem questões neste conteúdo.');
  const bo = BOSSES[Math.floor(Math.random() * BOSSES.length)];
  const maxHp = Math.ceil(qs.length * 0.7) * 100;
  B = { deck: id, title, qs, i: 0, hp: maxHp, maxHp, lives: 3, score: 0, combo: 0, correct: 0, t: QTIME, answered: false, pick: -1, over: false, face: bo[0], boss: bo[1], hit: false };
  go('arena');
}
function arenaFight() {
  const q = B.qs[B.i];
  return `
  <div class="card glow">

    <div class="qbox">${esc(q.pergunta)}</div>
    <div class="opts">${q.opcoes.map((o, i) => {
      let c = ''; if (B.answered) { if (i === q.correta) c = 'ok'; else if (i === B.pick) c = 'bad'; }
      return `<button class="opt ${c}" data-act="answer" data-i="${i}" ${B.answered ? 'disabled' : ''}><span class="k">${q.tipo === 'vf' ? (i ? 'F' : 'V') : 'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    }).join('')}</div>
    ${B.answered ? `<div class="fb ${B.pick === q.correta ? 'ok' : 'bad'}"><b>${B.pick === q.correta ? `✔ Golpe crítico! +${B.gainNow} pts` : B.pick < 0 ? '⏱ Tempo esgotado!' : '✖ O chefe bloqueou!'}</b>\n${esc(q.explicacao)}</div>
    <button class="btn full" style="margin-top:12px" data-act="next">${B.lives && B.hp > 0 && B.i < B.qs.length - 1 ? 'Próxima ▶' : 'Ver resultado ▶'}</button>` : ''}
  </div>
  <div class="row" style="margin-top:12px"><button class="btn sm ghost" data-act="flee">🏳️ Fugir da batalha</button></div>`;
}
function startTimer() {
  stopTimer();
  BTIMER = setInterval(() => {
    if (!B || B.answered || B.over) return stopTimer();
    B.t = Math.max(0, B.t - 0.1);
    const bar = $('#tbar'); if (bar) bar.style.width = (B.t / QTIME * 100) + '%';
    if (B.t <= 0) answer(-1);
  }, 100);
}
function stopTimer() { if (BTIMER) clearInterval(BTIMER); BTIMER = null; }
function answer(i) {
  if (!B || B.answered) return;
  stopTimer();
  const q = B.qs[B.i]; B.answered = true; B.pick = i;
  if (i === q.correta) {
    B.combo++; B.correct++;
    B.gainNow = Math.round((100 + Math.round(B.t * 6)) * (1 + (B.combo - 1) * 0.25));
    B.score += B.gainNow; B.hp = Math.max(0, B.hp - 100); B.hit = true;
  } else {
    B.combo = 0; B.lives--; B.hit = false;
    if (navigator.vibrate) navigator.vibrate(120);
  }
  render(); B.hit = false;
}
function nextQ() {
  if (B.lives <= 0 || B.hp <= 0 || B.i >= B.qs.length - 1) return finishFight();
  B.i++; B.t = QTIME; B.answered = false; B.pick = -1; render();
}
function finishFight() {
  B.over = true;
  B.win = B.hp <= 0;
  B.acc = Math.round(B.correct / (B.i + 1) * 100);
  const perfect = B.win && B.correct === B.qs.length;
  B.xp = Math.round(B.score / 20) + (B.win ? 40 : 10) + (perfect ? 30 : 0);
  S.battles.push({ deck: B.deck, title: B.title, score: B.score, acc: B.acc, win: B.win, date: today() });
  if (S.battles.length > 200) S.battles = S.battles.slice(-200);
  if (B.win) S.stats.bosses++;
  if (perfect) S.stats.perfect++;
  // conclui missão de arena pendente, se houver
  const m = S.missions.find(x => !x.done && x.kind === 'Arena' && (B.deck === 'mix' || x.title.includes(B.title)));
  gain(B.xp, B.win ? 'Chefe derrotado!' : 'Batalha concluída');
  if (m) completeMission(m.id); else render();
}

/* ---------------- TOAST ---------------- */
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------------- EVENTOS ---------------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT') return; // checkboxes tratados no change
  const { act, id, i, v } = el.dataset;
  switch (act) {
    case 'done': completeMission(id); break;
    case 'focus': openFocus(id); break;
    case 'fpause': FOCUS.run = !FOCUS.run; el.textContent = FOCUS.run ? '⏸ Pausar' : '▶ Retomar'; break;
    case 'fdone': { const fid = FOCUS.id; closeModal(); completeMission(fid); break; }
    case 'close': closeModal(); break;
    case 'settings': openSettings(); break;
    case 'newCamp': {
      const sub = $('#cSub').value.trim(), top = $('#cTop').value.trim();
      if (!sub || !top) return toast('Preencha matéria e assunto.');
      S.campaigns.push({ id: uid(), subject: sub, topic: top, min: +$('#cMin').value, plan: buildPlan(top, +$('#cDays').value), step: 0 });
      S.lastGen = null; save(); toast('🗺️ Campanha iniciada! Primeira missão liberada.'); render(); break;
    }
    case 'quick': {
      const t = $('#qTitle').value.trim(); if (!t) return toast('Escreva a missão.');
      const mn = +$('#qMin').value;
      S.missions.push({ id: uid(), title: t, kind: 'Rápida', min: mn, xp: 5 + mn * 2, date: today(), done: false });
      save(); render(); break;
    }
    case 'delCamp': if (confirm('Remover esta campanha?')) { S.campaigns = S.campaigns.filter(c => c.id !== id); S.missions = S.missions.filter(m => m.camp !== id || m.done); save(); render(); } break;
    case 'mode': S.settings.mode = v; save(); render(); break;
    case 'rmImg': IMGS.splice(+i, 1); drawThumbs(); break;
    case 'ocr': runOCR(); break;
    case 'analyze': analyze(); break;
    case 'open': DECK = id; DECKTAB = 'resumo'; VIEW = 'inventario'; document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.go === 'inventario')); render(); window.scrollTo(0, 0); break;
    case 'back': DECK = null; render(); break;
    case 'tab': DECKTAB = v; render(); break;
    case 'ans': $('#ans' + i).classList.toggle('on'); break;
    case 'delDeck': if (confirm('Apagar este conteúdo do inventário?')) { S.decks = S.decks.filter(d => d.id !== id); DECK = null; save(); render(); } break;
    case 'fight': startFight(id); break;
    case 'answer': answer(+i); break;
    case 'next': nextQ(); break;
    case 'flee': if (confirm('Fugir da batalha? O progresso dela será perdido.')) { stopTimer(); B = null; render(); } break;
    case 'arenaHome': B = null; render(); break;
    case 'saveSet':
      S.player.name = $('#setName').value.trim().slice(0, 20) || S.player.name;
      S.settings.mode = $('#setMode').value; S.settings.apiKey = $('#setKey').value.trim();
      save(); closeModal(); render(); toast('✅ Configurações salvas.'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ ...S, settings: { ...S.settings, apiKey: '' } }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kaizen-quest-backup-' + today() + '.json'; a.click(); break;
    }
    case 'import': $('#backupIn').click(); break;
    case 'reset': if (confirm('Tem certeza? Todo o progresso será apagado.') && confirm('Última chance: apagar mesmo?')) { const k = S.settings.apiKey; S = DEF(); S.settings.apiKey = k; save(); closeModal(); onboarding(); render(); } break;
    case 'onOk': { const n = $('#onName').value.trim(); if (!n) return toast('Escolha um codinome.'); S.player.name = n.slice(0, 20); save(); closeModal(); render(); toast('🎮 Jogo iniciado. Sua primeira missão já está na Base.'); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fileIn') { addFiles(el.files); el.value = ''; return; }
  if (el.id === 'backupIn') {
    const f = el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.player) throw 0; const k = S.settings.apiKey; localStorage.setItem(KEY, JSON.stringify(d)); S = load(); if (!S.settings.apiKey) S.settings.apiKey = k; save(); closeModal(); render(); toast('✅ Backup restaurado.'); } catch { toast('⚠️ Arquivo inválido.'); } };
    r.readAsText(f); el.value = ''; return;
  }
  const act = el.dataset.act; if (!act || !el.checked) return;
  const d = S.decks.find(x => x.id === el.dataset.id), i = +el.dataset.i; if (!d) return;
  if (act === 'exDone' && !d.exDone.includes(i)) {
    d.exDone.push(i); S.stats.exercises++;
    const m = S.missions.find(x => !x.done && x.kind === 'Caderno' && x.title.includes('exercícios') && x.title.includes(d.title));
    gain(8, 'Exercício no caderno');
    if (m && d.exDone.length >= 3) completeMission(m.id); else render();
  }
  if (act === 'qDone' && !d.qDone.includes(i)) { d.qDone.push(i); S.stats.critical++; gain(5, 'Pensamento crítico'); render(); }
});
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.items || [])].filter(it => it.type.startsWith('image/')).map(it => it.getAsFile());
  if (!files.length) return;
  e.preventDefault();
  if (VIEW !== 'scanner') go('scanner');
  addFiles(files); toast('📋 Imagem colada.');
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#onName')) closeModal(); });
document.addEventListener('keydown', e => {
  if (VIEW === 'arena' && B && !B.over) {
    const q = B.qs[B.i], map = { a: 0, b: 1, c: 2, d: 3, v: 0, f: 1, 1: 0, 2: 1, 3: 2, 4: 3 };
    const k = e.key.toLowerCase();
    if (!B.answered && k in map && map[k] < q.opcoes.length && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) answer(map[k]);
    else if (B.answered && e.key === 'Enter') nextQ();
  }
  if (e.key === 'Escape' && !$('#onName')) closeModal();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { ensureToday(); render(); } });

/* ---------------- BOOT ---------------- */
go('base');
if (!S.player.name) onboarding();
</script>
</body>
</html>
